services:
  postgres:
    image: postgres:16-alpine
    container_name: openledger-db
    environment:
      POSTGRES_USER: openledger
      POSTGRES_PASSWORD: openledger_dev_password
      POSTGRES_DB: openledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openledger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
